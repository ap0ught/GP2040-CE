name: Sync Upstream

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  push:
    branches: ["release"]
  workflow_dispatch:

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/OpenStickCommunity/GP2040-CE.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "Commits behind upstream: ${BEHIND}"

      - name: Merge upstream changes
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main --no-edit -m "chore: sync with upstream OpenStickCommunity/GP2040-CE"

      - name: Push synced changes
        if: steps.check.outputs.behind != '0'
        run: git push origin main

  sync-releases:
    if: github.event_name == 'push' && github.ref_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/OpenStickCommunity/GP2040-CE.git

      - name: Sync upstream tags
        run: |
          git fetch upstream --tags
          git push origin --tags

      - name: Mirror upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="OpenStickCommunity/GP2040-CE"
          TARGET_REPO="${{ github.repository }}"
          gh api --paginate "repos/${UPSTREAM_REPO}/releases?per_page=100" --jq '.[] | @base64' | while IFS= read -r release_b64; do
            release="$(echo "${release_b64}" | base64 --decode)"
            tag_name="$(echo "${release}" | jq -r '.tag_name')"

            if gh release view "${tag_name}" --repo "${TARGET_REPO}" > /dev/null 2>&1; then
              echo "Release ${tag_name} already exists in ${TARGET_REPO}"
              continue
            fi

            release_name="$(echo "${release}" | jq -r '.name // .tag_name')"
            prerelease_flag="$(echo "${release}" | jq -r '.prerelease')"
            draft_flag="$(echo "${release}" | jq -r '.draft')"
            notes_file="$(mktemp)"

            echo "${release}" | jq -r '.body // ""' > "${notes_file}"

            extra_args=()
            if [ "${prerelease_flag}" = "true" ]; then
              extra_args+=(--prerelease)
            fi
            if [ "${draft_flag}" = "true" ]; then
              extra_args+=(--draft)
            fi

            if [ "${#extra_args[@]}" -gt 0 ]; then
              gh release create "${tag_name}" \
                --repo "${TARGET_REPO}" \
                --title "${release_name}" \
                --notes-file "${notes_file}" \
                "${extra_args[@]}"
            else
              gh release create "${tag_name}" \
                --repo "${TARGET_REPO}" \
                --title "${release_name}" \
                --notes-file "${notes_file}"
            fi
          done
