name: Sync Upstream

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/OpenStickCommunity/GP2040-CE.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "Commits behind upstream: ${BEHIND}"

      - name: Merge upstream changes
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main --no-edit -m "chore: sync with upstream OpenStickCommunity/GP2040-CE"

      - name: Push synced changes
        if: steps.check.outputs.behind != '0'
        run: git push origin main
